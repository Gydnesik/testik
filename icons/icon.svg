<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C2BE8"/>
      <stop offset="0.5" stop-color="#5B16B8"/>
      <stop offset="1" stop-color="#35106F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#B86CFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#6A24C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seed" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#6B321D"/>
      <stop offset=".7" stop-color="#3B1A20"/>
      <stop offset="1" stop-color="#24101A"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17052E" flood-opacity=".5"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <g id="petal">
      <ellipse cx="0" cy="-37" rx="13" ry="36" fill="#FFC928"/>
      <ellipse cx="0" cy="-37" rx="7" ry="30" fill="#FFDF4A" opacity=".75"/>
    </g>
    <g id="sunflower">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(30)"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(150)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(210)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(300)"/>
      <use href="#petal" transform="rotate(330)"/>
      <circle r="20" fill="url(#seed)"/>
      <circle r="14" fill="none" stroke="#9A5630" stroke-width="2" stroke-dasharray="2 4" opacity=".8"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="235" r="205" fill="url(#glow)"/>

  <!-- subtle decorative sparkles -->
  <g fill="#FFD95A" opacity=".8">
    <circle cx="255" cy="65" r="3"/>
    <circle cx="392" cy="154" r="4"/>
    <circle cx="104" cy="214" r="3"/>
    <circle cx="418" cy="326" r="3"/>
    <circle cx="83" cy="352" r="4"/>
    <path d="M349 72l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M138 118l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </g>

  <!-- purple leaves behind flowers -->
  <g fill="#9B63E8" opacity=".65">
    <ellipse cx="58" cy="105" rx="18" ry="48" transform="rotate(-45 58 105)"/>
    <ellipse cx="447" cy="108" rx="18" ry="48" transform="rotate(45 447 108)"/>
    <ellipse cx="71" cy="410" rx="18" ry="52" transform="rotate(45 71 410)"/>
    <ellipse cx="442" cy="409" rx="18" ry="52" transform="rotate(-45 442 409)"/>
  </g>

  <!-- sunflowers -->
  <g transform="translate(70 72) scale(.9)" filter="url(#shadow)">
    <use href="#sunflower"/>
  </g>
  <g transform="translate(442 84) scale(.78)" filter="url(#shadow)">
    <use href="#sunflower"/>
  </g>
  <g transform="translate(70 438) scale(.78)" filter="url(#shadow)">
    <use href="#sunflower"/>
  </g>
  <g transform="translate(438 438) scale(.9)" filter="url(#shadow)">
    <use href="#sunflower"/>
  </g>

  <!-- center medallion -->
  <circle cx="256" cy="256" r="142" fill="#4A1692" opacity=".5"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#C58AFF" stroke-opacity=".22" stroke-width="2"/>

  <!-- white G -->
  <text x="256" y="315"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="190"
        font-weight="700"
        fill="#FFFFFF"
        stroke="#EBD8FF"
        stroke-width="2"
        paint-order="stroke"
        filter="url(#shadow)">G</text>

  <!-- small shine -->
  <path d="M173 169 C205 137 253 124 292 133" fill="none"
        stroke="#FFFFFF" stroke-opacity=".25" stroke-width="8" stroke-linecap="round"/>
</svg>
