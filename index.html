function render(){apply();if(!session){document.getElementById('app').innerHTML=authPage();bindAuth();return}document.getElementById('app').innerHTML=appShell();bind();}
function authPage(){return `<div class="authPage"><div class="authCard"><div class="authLogo">▣</div><h1>Школьный Помощник</h1><p class="muted">Войди или создай аккаунт — расписание и класс сохранятся за тобой.</p><div class="authTabs"><button class="${authMode==='login'?'sel':''}" data-authmode="login">Войти</button><button class="${authMode==='signup'?'sel':''}" data-authmode="signup">Регистрация</button></div>${authMode==='signup'?`<div class="form"><div class="field"><label>Никнейм</label><input id="au" maxlength="30" placeholder="Например, Вася"></div><div class="field"><label>Класс</label><select id="ac">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Пароль</label><input id="ap" type="password" minlength="6" placeholder="Минимум 6 символов"></div><button class="primary" data-auth="signup">Создать аккаунт</button></div>`:`<div class="form"><div class="field"><label>Никнейм</label><input id="au" maxlength="30" placeholder="Твой ник"></div><div class="field"><label>Пароль</label><input id="ap" type="password" placeholder="Пароль"></div><button class="primary" data-auth="login">Войти</button><div class="small muted">Забыл пароль? Попроси администратора изменить его в аккаунте.</div></div>`}<p id="authMsg" class="small muted" style="margin:12px 0 0"></p><p class="small muted" style="margin-top:18px">Пароль хранится в Supabase Auth. В приложении он не сохраняется.</p></div></div>`}
let authMode='login';
function bindAuth(){document.querySelectorAll('[data-authmode]').forEach(b=>b.onclick=()=>{authMode=b.dataset.authmode;render()});document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>authAction(b.dataset.auth))}
function technicalEmail(username){let bytes=new TextEncoder().encode(username.trim().toLowerCase());let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));return 'u_'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+'@igbkjkjagkhxpxezjwtj.supabase.co'}
async function authAction(action){const msg=document.getElementById('authMsg');if(msg)msg.textContent='';let username=document.getElementById('au')?.value.trim();let password=document.getElementById('ap')?.value||'';if(username.length<2)return setAuthMsg('Никнейм должен быть не короче 2 символов.');if(password.length<6)return setAuthMsg('Пароль должен быть не короче 6 символов.');const email=technicalEmail(username);
 if(action==='signup'){const className=document.getElementById('ac').value;setAuthMsg('Создаю аккаунт…');const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,class_name:className}}});if(error)return setAuthMsg(error.message);if(!data.session){return setAuthMsg('Аккаунт создан, но Supabase просит подтверждение email. В Supabase отключи Confirm email — после этого регистрация будет работать без почты.')}await bootUser(data.session)}
 if(action==='login'){setAuthMsg('Вхожу…');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return setAuthMsg('Не удалось войти: '+error.message);await bootUser(data.session)}}
function setAuthMsg(t){const x=document.getElementById('authMsg');if(x)x.textContent=t}
async function bootUser(s){session=s;const {data,error}=await sb.from('profiles').select('*').eq('id',s.user.id).single();if(error){await sb.auth.signOut();session=null;return setAuthMsg('Профиль не найден. Проверь trigger profiles в Supabase.')}profile=data;route='home';await loadSchedule();startScheduleRealtime();render()}
async function loadAllSchedules(){allSchedules={};if(!profile)return;const {data,error}=await sb.from('schedules').select('class_name,lessons,updated_at').order('class_name',{ascending:true});if(error){console.error('all schedules load:',error);return}const groups=normalizeScheduleRows(data||[]);for(const c of CLASSES){const canonical=normalizeClassName(c)||c;const row=(data||[]).find(x=>normalizeClassName(x.class_name)===canonical);allSchedules[canonical]={class_name:c,lessons:groups[canonical]||[],updated_at:row?.updated_at||null}}} 
async function loadSchedule(){schedule=null;if(!profile)return;await loadAllSchedules();const canonical=normalizeClassName(profile.class_name)||profile.class_name;const item=allSchedules[canonical];schedule=item?{class_name:canonical,lessons:item.lessons,updated_at:item.updated_at}:{class_name:canonical,lessons:[],updated_at:null}}
function stopScheduleRealtime(){if(scheduleReloadTimer){clearTimeout(scheduleReloadTimer);scheduleReloadTimer=null}if(scheduleChannel){sb.removeChannel(scheduleChannel);scheduleChannel=null}}
function startScheduleRealtime(){stopScheduleRealtime();if(!session)return;scheduleChannel=sb.channel('school-helper-schedules-live').on('postgres_changes',{event:'*',schema:'public',table:'schedules'},()=>{if(scheduleReloadTimer)clearTimeout(scheduleReloadTimer);scheduleReloadTimer=setTimeout(async()=>{scheduleReloadTimer=null;if(!session||!profile)return;await loadSchedule();if(route==='admin'){await adminStats();await adminClasses()}render()},120)}).subscribe()}
function appShell(){return `<header class="top"><button class="icon" id="hamb">☰</button><div class="brand"><div class="logo">▣</div><div><b>Школьный Помощник</b><small>${e(profileName())} · ${e(profile.class_name)}</small></div></div><div class="rowActions"><button class="icon" id="accountTop">♙</button>${isAdmin()?'<button class="topAdmin" data-r2="admin">ADMIN</button>':''}</div></header><main id="screen" class="screen">${({home,homework:hw,grades,calendar,absences,schedules,settings,account,admin}[route]||home)()}</main><nav class="bottom"><button class="nav ${route==='home'?'on':''}" data-r="home">⌂<small>Главная</small></button><button class="nav ${route==='homework'?'on':''}" data-r="homework">▤<small>ДЗ</small></button><button class="nav ${route==='grades'?'on':''}" data-r="grades">▱<small>Оценки</small></button><button class="nav ${route==='settings'?'on':''}" data-r="settings">⚙<small>Настройки</small></button></nav>`}
function home(){return `<div class="head"><h1>Расписание</h1><div class="wrap"><button class="icon act" data-a="schedMenu">⋮</button><div class="menu" id="schedMenu" hidden>${isAdmin()?'<button data-r2="admin">🛡 Админ-панель</button>':''}<button data-a="account">👤 Аккаунт</button><button data-a="scheduleReload">↻ Обновить расписание</button></div></div></div>${schedule?.lessons?.length?scheduleCard():`<div class="card empty"><b>Расписания для ${e(profile.class_name)} пока нет</b>Администратор ещё не загрузил расписание для этого класса.<br><br>${isAdmin()?'<button class="primary" data-r2="admin">Загрузить расписание</button>':''}</div>`}<div class="head" style="margin-top:25px"><h2>Ближайшие задания</h2><button class="secondary" data-a="addHw">+</button></div>${local.homework.length?local.homework.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(hwItem).join(''):'<div class="card empty">Нет заданий. Нажми «+», чтобы добавить.</div>'}`}
function scheduleCard(){const groups={};for(const x of schedule.lessons||[]){const day=x.day||'Расписание';(groups[day]??=[]).push(x)}let html=`<div class="card schedule"><div class="scheduleHead"><div class="row"><div><b>${e(profile.class_name)}</b><div class="small muted">${schedule.updated_at?'Обновлено '+new Date(schedule.updated_at).toLocaleString('ru-RU'):''}</div></div><span class="badge">${schedule.lessons.length} уроков</span></div></div>`;for(const [day,arr] of Object.entries(groups)){html+=`<div class="scheduleDay">${e(day)}</div><div class="scheduleList">${arr.map((x,i)=>`<div class="lesson"><div class="num">${e(x.lesson||i+1)}</div><div><b>${e(x.subject||'Урок')}</b><small>${e([x.time,x.room?'каб. '+x.room:''].filter(Boolean).join(' · '))}</small></div><button class="lessonMark" data-a="markAbsence" data-subject="${e(x.subject||'')}" data-day="${e(day)}" title="Отметить пропуск">☒</button></div>`).join('')}</div>`}return html+'</div>'}
function hwItem(x){return `<div class="card"><div class="item"><div class="subjectIcon">▤</div><div class="itemMain"><b>${e(x.subject)}</b><span>${e(x.text)} · до ${e(x.date)}</span></div><div class="rowActions"><button class="tinyBtn" data-a="editHw" data-id="${x.id}" title="Изменить">✎</button><button class="tinyBtn dangerBtn" data-a="deleteHw" data-id="${x.id}" title="Удалить">×</button><button class="check ${x.done?'done':''}" data-a="toggleHw" data-id="${x.id}"></button></div></div></div>`}
function scheduleClassCard(item,compact=false){const lessons=item?.lessons||[];const groups={};for(const x of lessons){const day=x.day||'Расписание';(groups[day]??=[]).push(x)}let body='';for(const [day,arr] of Object.entries(groups)){body+=`<div class="scheduleDay">${e(day)}</div><div class="scheduleList">${arr.map((x,i)=>`<div class="lesson"><div class="num">${e(x.lesson||i+1)}</div><div><b>${e(x.subject||'Урок')}</b><small>${e([x.time,x.room?'каб. '+x.room:''].filter(Boolean).join(' · '))}</small></div></div>`).join('')}</div>`}return `<div class="card classScheduleCard"><div class="scheduleHead"><div class="row"><div><b>${e(item.class_name)}</b><div class="small muted">${item.updated_at?'Обновлено '+new Date(item.updated_at).toLocaleString('ru-RU'):''}</div></div><span class="badge">${lessons.length} уроков</span></div></div>${lessons.length?`<div class="scheduleGroup">${body}</div>`:`<div class="scheduleEmpty"><b>Расписание пока не загружено</b>Для ${e(item.class_name)} в базе нет уроков.</div>`}</div>`}
function schedules(){const current=normalizeClassName(profile.class_name)||profile.class_name;return `<div class="head"><div><h1>Расписания</h1><div class="small muted" style="margin-top:4px">Все классы из базы</div></div><button class="secondary" data-a="scheduleReload">↻</button></div><div class="scheduleTabs">${CLASSES.map(c=>{const k=normalizeClassName(c)||c;return `<button class="scheduleTab ${k===current?'sel':''}" data-class-tab="${e(k)}">${e(c)}</button>`}).join('')}</div><div id="allScheduleCards">${CLASSES.map(c=>{const k=normalizeClassName(c)||c;return scheduleClassCard(allSchedules[k]||{class_name:c,lessons:[]})}).join('')}</div>`}
function hw(){return `<div class="head"><h1>Домашние задания</h1><button class="secondary" data-a="addHw">+</button></div>${local.homework.length?local.homework.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(hwItem).join(''):'<div class="card empty"><b>Пока пусто</b>Добавляй задания и отмечай выполненные.</div>'}`}
function gradeGoalInfo(a,t){
  const n=a.length,sum=a.reduce((x,y)=>x+y,0),av=n?sum/n:0;
  const threshold=t===5?4.5:3.5;
  if(!n)return t===5?'Добавь оценки, чтобы увидеть прогресс до 5 за четверть':'Добавь оценки, чтобы увидеть прогресс до 4 за четверть';
  if(av+1e-9>=threshold)return `Чтобы получить ${t} за четверть, текущего среднего достаточно (≈ ${av.toFixed(2)}).`;
  const need=Math.max(1,Math.ceil((threshold*n-sum)/(5-threshold)-1e-9));
  const nextAvg=(sum+need*5)/(n+need);
  return `Чтобы получить ${t} за четверть, нужно ещё ${need} ${need===1?'оценку 5':'оценки 5'}. Средний станет ≈ ${nextAvg.toFixed(2)}.`;
}
function grades(){const entries=Object.entries(local.grades);return `<div class="head"><h1>Оценки</h1><button class="secondary" data-a="addSubject">+</button></div>${entries.length?entries.map(([s,a])=>{let av=avg(a),t=local.targets[s]||4,quarter=a.length?q(av):'—',threshold=t===5?4.5:3.5;return `<div class="card gradeCard"><div class="row"><div><b>${e(s)}</b><div class="small muted">Итог за четверть: ${quarter}</div></div><div class="wrap"><button class="icon" data-a="gm" data-s="${e(s)}">⋮</button><div class="menu" id="gm-${sid(s)}" hidden><button data-a="addGrade" data-s="${e(s)}">+ Добавить оценку</button><button data-a="editGrades" data-s="${e(s)}">✎ Изменить оценки</button><button class="danger" data-a="delSubject" data-s="${e(s)}">Удалить предмет</button></div></div></div><div class="grades">${a.length?a.map((v,i)=>`<button class="grade g${v} clickable" data-a="editOneGrade" data-s="${e(s)}" data-i="${i}" title="Изменить оценку">${v}</button>`).join(''):'<span class="small muted">Оценок пока нет</span>'}</div><div class="gradeTargetRow"><span class="small muted">Хочу получить</span><div class="targetBtns"><button class="targetBtn ${t===4?'sel':''}" data-target="${e(s)}" data-value="4">Хочу 4</button><button class="targetBtn ${t===5?'sel':''}" data-target="${e(s)}" data-value="5">Хочу 5</button></div></div><div class="gradeStats"><div class="gradeStat"><b>${av?av.toFixed(2):'—'}</b><span>средний сейчас</span></div><div class="gradeStat"><b>${a.length}</b><span>оценок всего</span></div><div class="gradeStat"><b>${quarter}</b><span>четвертная сейчас</span></div><div class="gradeStat"><b>${t.toFixed(0)}</b><span>желаемая четвертная</span></div></div><div class="goal ${av+1e-9>=threshold?'ok':''}">${e(gradeGoalInfo(a,t))}</div><div class="progress"><i style="width:${Math.min(100,(av/5)*100)}%"></i></div></div>`}).join(''):'<div class="card empty"><b>Оценок пока нет</b>Нажми «+», чтобы добавить первый предмет.</div>'}`}

function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function calendar(){const now=new Date();const y=calendarState.y,m=calendarState.m;const first=new Date(y,m,1);const days=new Date(y,m+1,0).getDate();const offset=(first.getDay()+6)%7;const today=dateKey(now.getFullYear(),now.getMonth(),now.getDate());const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let cells='';for(let i=0;i<offset;i++)cells+=`<div class="calDay mutedDay"></div>`;for(let d=1;d<=days;d++){const key=dateKey(y,m,d),dow=(offset+d-1)%7, note=local.calendar[key];cells+=`<div class="calDay ${key===today?'today ':''}${dow>=5?'weekend ':''}${note?'noteDay':''}"${note?.color?` style="--note-color:${e(note.color)}"`:''}><b>${d}</b><button data-cal-date="${key}" aria-label="${key}"></button></div>`}return `<div class="head"><h1>Календарь</h1></div><div class="card calendarWrap"><div class="calendarHead"><button class="tinyBtn" data-cal-prev>‹</button><strong>${new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</strong><button class="tinyBtn" data-cal-next>›</button></div><div class="calWeek">${names.map((x,i)=>`<span class="${i>=5?'weekend':''}">${x}</span>`).join('')}</div><div class="calendarGrid">${cells}</div><div class="small muted" style="margin-top:9px">Нажми на число, чтобы добавить или изменить заметку. Зелёные — выходные.</div></div>${calendarNotePreview()}`}
function calendarNotePreview(){const keys=Object.keys(local.calendar).sort();const future=keys.filter(k=>k>=dateKey(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()));if(!future.length)return '';const k=future[0],n=local.calendar[k];return `<div class="card calendarNote"><b>Ближайшая заметка · ${new Date(k+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</b><span>${e(n.text||'')}</span></div>`}
let calendarState={y:new Date().getFullYear(),m:new Date().getMonth()};
function openCalendarNote(key){const existing=local.calendar[key]||{text:'',color:'#8057e8'};modal(`<div class="modalHead"><h3>Заметка · ${new Date(key+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</h3>${closeButton()}</div><div class="form"><div class="field"><label>Заметка</label><textarea id="calText" placeholder="Например: контрольная по математике">${e(existing.text||'')}</textarea></div><div class="field"><label>Цвет отметки</label><div class="colors">${['#8057e8','#2878e5','#24ad80','#e8a32e','#e65d62'].map(c=>`<button class="color ${existing.color===c?'sel':''}" style="background:${c}" data-cal-color="${c}"></button>`).join('')}</div></div><div class="rowActions"><button class="primary" id="saveCalNote">Сохранить</button>${local.calendar[key]?'<button class="secondary dangerBtn" id="deleteCalNote">Удалить</button>':''}</div></div>`);let color=existing.color||'#8057e8';document.querySelectorAll('[data-cal-color]').forEach(b=>b.onclick=()=>{color=b.dataset.calColor;document.querySelectorAll('[data-cal-color]').forEach(x=>x.classList.toggle('sel',x===b))});document.getElementById('saveCalNote').onclick=()=>{const text=document.getElementById('calText').value.trim();if(!text){delete local.calendar[key]}else local.calendar[key]={text,color};saveLocal();closeModal();render()};document.getElementById('deleteCalNote')?.addEventListener('click',()=>{delete local.calendar[key];saveLocal();closeModal();render()})}
function absenceReasonLabel(r){return {sick:'По болезни',excused:'Уважительная причина',unexcused:'Без причины'}[r]||'Без причины'}function absences(){const list=local.absences.slice().sort((a,b)=>b.date.localeCompare(a.date));const bySubject={};for(const x of list){bySubject[x.subject]=(bySubject[x.subject]||0)+1}const subjectRows=Object.entries(bySubject).sort((a,b)=>b[1]-a[1]);return `<div class="head"><h1>Пропуски</h1><button class="secondary" data-a="addAbsence">+</button></div><div class="card"><div class="stats"><div class="stat"><b>${list.length}</b><span>пропусков всего</span></div><div class="stat"><b>${subjectRows.length}</b><span>предметов</span></div></div>${subjectRows.length?`<div class="small muted" style="margin-top:10px">По предметам:</div><div class="grades" style="margin-top:8px">${subjectRows.map(([s,n])=>`<span class="badge">${e(s)} · ${n}</span>`).join('')}</div>`:''}</div>${list.length?list.map(x=>`<div class="card"><div class="item"><div class="subjectIcon">☒</div><div class="itemMain"><b>${e(x.subject)}</b><span>${new Date(x.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}${x.day?' · '+e(x.day):''} · ${e(absenceReasonLabel(x.reason))}</span></div><button class="tinyBtn dangerBtn" data-a="deleteAbsence" data-id="${x.id}" title="Удалить">×</button></div></div>`).join(''):'<div class="card empty"><b>Пропусков пока нет</b>Отмечай пропущенные уроки прямо из расписания (значок ☒ у урока) или добавляй вручную.</div>'}`}function openAbsence(prefill){prefill=prefill||{};modal(`<div class="modalHead"><h3>Отметить пропуск</h3>${closeButton()}</div><div class="form"><div class="field"><label>Предмет</label><input id="as" value="${e(prefill.subject||'')}" placeholder="Например, Математика"></div><div class="field"><label>Дата</label><input id="ad" type="date"></div><div class="field"><label>Причина</label><select id="ar"><option value="unexcused">Без причины</option><option value="sick">По болезни</option><option value="excused">Уважительная причина</option></select></div><button class="primary" id="saveA">Добавить</button></div>`);document.getElementById('ad').value=new Date().toISOString().slice(0,10);document.getElementById('saveA').onclick=()=>{const s=document.getElementById('as').value.trim(),dt=document.getElementById('ad').value,r=document.getElementById('ar').value;if(!s||!dt)return alert('Укажи предмет и дату.');local.absences.push({id:Date.now(),subject:s,date:dt,day:prefill.day||'',reason:r});saveLocal();closeModal();render()}}function settings(){return `<div class="head"><h1>Настройки</h1></div><div class="card"><h3>Внешний вид</h3><div class="theme">${[['light','☀ Светлая'],['dark','☾ Тёмная'],['system','◐ Авто']].map(x=>`<button class="${local.settings.theme===x[0]?'sel':''}" data-theme="${x[0]}">${x[1]}</button>`).join('')}</div><p class="small muted">Цвет акцента</p><div class="colors">${['#8057e8','#2878e5','#24ad80','#e8a32e','#e65d62'].map(c=>`<button class="color ${local.settings.accent===c?'sel':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div></div><div class="card"><h3>Система</h3><div class="small muted">Локальные уведомления и звуки пока не используются приложением.</div></div><div class="card"><div class="row"><div><b>Расписание</b><span class="small muted" style="display:block;margin-top:4px">Берётся из Supabase по твоему классу ${e(profile.class_name)}.</span></div><button class="secondary" data-a="scheduleReload">Обновить</button></div></div>`}
function account(){return `<div class="head"><h1>Аккаунт</h1></div><div class="card"><div class="row"><div><span class="small muted">Никнейм</span><h2 style="margin:5px 0 0">${e(profile.username)}</h2></div>${isAdmin()?'<span class="badge adminBadge">ADMIN</span>':''}</div><div class="form" style="margin-top:16px"><div class="field"><label>Никнейм</label><input id="an" maxlength="30" value="${e(profile.username)}"></div><div class="field"><label>Класс</label><select id="ac2">${CLASSES.map(c=>`<option ${c===profile.class_name?'selected':''}>${c}</option>`).join('')}</select></div><button class="primary" data-a="saveAccount">Сохранить профиль</button></div></div><div class="card"><h3>Пароль</h3><div class="form"><div class="field"><label>Новый пароль</label><input id="newpass" type="password" minlength="6" placeholder="Минимум 6 символов"></div><button class="secondary" data-a="changePassword">Изменить пароль</button></div></div><div class="card"><button class="secondary logout" style="width:100%" data-a="logout">Выйти из аккаунта</button></div>`}
function admin(){return `<div class="head"><h1>Админ-панель</h1><span class="badge adminBadge">ADMIN</span></div><div class="notice ok adminNotice">У тебя есть права администратора. Здесь можно загрузить таблицу расписания, изменить классы вручную и управлять учениками.</div><div class="card"><h3>Загрузка расписания</h3><p class="muted small">Выбери электронную таблицу в формате XLSX, ODS или CSV. Сервер сохраняет координаты ячеек и объединения, раскладывает уроки по физическим столбцам классов и проверяет каждую ячейку перед записью.</p><div class="photo"><b>📊 Таблица общего расписания</b><br><span class="small muted">Поддерживаются .xlsx, .ods и .csv. Старое расписание будет полностью заменено новым после успешной обработки.</span><input id="adminScheduleFile" type="file" accept=".xlsx,.ods,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.spreadsheet,text/csv"><div class="photoAction"><button class="secondary" id="pickAdminScheduleFile" type="button">Выбрать файл</button><span id="adminScheduleFileName" class="photoFileName">Файл ещё не выбран</span></div></div><div id="adminResult" style="margin-top:12px"></div></div><div class="card"><div class="row"><h3 style="margin:0">Классы в расписании</h3><button class="tinyBtn" data-a="adminReload">↻</button></div><div id="adminClasses" class="adminGrid" style="margin-top:10px"><div class="small muted">Загружаю…</div></div></div><div class="card"><div class="row"><h3 style="margin:0">Ученики</h3><button class="tinyBtn" data-a="adminUsersReload">↻</button></div><div id="adminUsers" style="margin-top:8px"><div class="small muted">Загружаю…</div></div></div>`}
async function readAdminScheduleFile(ev){
  const f=ev.target.files?.[0];if(!f)return;
  const name=document.getElementById('adminScheduleFileName');if(name)name.textContent=f.name;
  const box=document.getElementById('adminResult');
  box.innerHTML='<div class="notice">⏳ Загружаю таблицу. Сервер читает исходную сетку с координатами и объединёнными ячейками, затем несколько раз сверяет результат с исходными ячейками…</div>';
  try{
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const allowed=['xlsx','ods','csv'];
    if(!allowed.includes(ext))throw Error('Поддерживаются файлы .xlsx, .ods и .csv.');
    if(f.size>12*1024*1024)throw Error('Файл слишком большой. Максимум 12 МБ.');
    const {data:{session:s}}=await sb.auth.getSession();
    if(!s)throw Error('Сессия истекла. Войди заново.');
    // Отправляем сам файл multipart/form-data вместо base64 JSON. Это уменьшает
    // размер запроса примерно на 33% и заметно снижает пик памяти Edge Function.
    const form=new FormData();
    form.append('file',f,f.name);
    const r=await fetch(EDGE_URL,{method:'POST',headers:{'Authorization':'Bearer '+s.access_token,'apikey':SUPABASE_PUBLISHABLE_KEY},body:form});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(data.error||'Ошибка обработки таблицы');
    const parsedByClass=normalizeScheduleRows(Object.entries(data.schedules||{}).map(([class_name,lessons])=>({class_name,lessons})));
    const classNames=Object.keys(parsedByClass);
    if(!classNames.length)throw Error('Сервер не нашёл ни одного класса в основной сетке.');
    const ignored=data.ignoredClasses?.length?` Не распознаны как поддерживаемые классы: ${data.ignoredClasses.join(', ')}.`:'';
    const v=data.verification||{};
    const details=v.totalSourceCells!==undefined?` Проверено исходных ячеек: <b>${v.totalSourceCells}</b>; записано уроков: <b>${v.totalParsedLessons??0}</b>.`:' Проверка исходных ячеек пройдена.';
    box.innerHTML=`<div class="notice ok">✓ Готово. Полностью заменено расписание: <b>${classNames.length}</b> классов.${details} Старые записи удалены перед сохранением нового файла; дубли не переносятся.${ignored}</div>`;
    await loadSchedule();await adminStats();await adminClasses();
  }catch(err){
    const msg=String(err.message||err);
    let extra='';
    try{
      const m=msg.match(/Проверка|повторная|Финальная/i);
      if(m)extra='<br><span class="small muted">Сервер остановил запись, потому что контроль исходных ячеек не совпал. Старое расписание не заменялось.</span>';
    }catch{}
    box.innerHTML='<div class="notice bad"><b>Не удалось обработать таблицу.</b><br>'+e(msg)+extra+'</div>'
  }finally{ev.target.value=''}
}
async function adminStats(){const box=document.getElementById('adminStats');if(!box)return;const {data,error}=await sb.from('schedules').select('class_name,updated_at');if(error){box.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}const unique=new Set((data||[]).map(x=>normalizeClassName(x.class_name)).filter(Boolean));const latest=data?.slice().sort((a,b)=>new Date(b.updated_at||0)-new Date(a.updated_at||0))[0];box.innerHTML=`<div class="stat"><b>${unique.size}</b><span>классов в расписании</span></div><div class="stat"><b>${latest?new Date(latest.updated_at).toLocaleDateString('ru-RU'):'—'}</b><span>последнее обновление</span></div>`}
async function adminClasses(){const box=document.getElementById('adminClasses');if(!box)return;const {data,error}=await sb.from('schedules').select('class_name,lessons,updated_at').order('updated_at',{ascending:false});if(error){box.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}const groups={};for(const x of data||[]){const c=normalizeClassName(x.class_name);if(!c)continue;if(!groups[c])groups[c]={class_name:c,lessons:[],updated_at:x.updated_at,rawNames:new Set()};groups[c].lessons.push(...normalizeLessons(x.lessons));groups[c].rawNames.add(x.class_name);if(new Date(x.updated_at||0)>new Date(groups[c].updated_at||0))groups[c].updated_at=x.updated_at}const rows=Object.values(groups).map(x=>({...x,lessons:normalizeLessons(x.lessons)})).sort((a,b)=>a.class_name.localeCompare(b.class_name,'ru'));if(!rows.length){box.innerHTML='<div class="small muted">Пока нет загруженных классов.</div>';return}box.innerHTML=rows.map(x=>`<div class="adminClass"><div class="row"><div><b>${e(x.class_name)}</b><div class="small muted">${x.lessons.length||0} уроков · ${x.updated_at?new Date(x.updated_at).toLocaleDateString('ru-RU'):''}${x.rawNames.size>1?' · объединены варианты написания':''}</div></div></div><div class="actions"><button class="tinyBtn" data-admin-edit="${e(x.class_name)}">✎ Изменить</button><button class="tinyBtn dangerBtn" data-admin-delete="${e(x.class_name)}">Удалить</button></div></div>`).join('');box.querySelectorAll('[data-admin-edit]').forEach(b=>b.onclick=()=>openScheduleEditor(b.dataset.adminEdit));box.querySelectorAll('[data-admin-delete]').forEach(b=>b.onclick=()=>deleteSchedule(b.dataset.adminDelete))}
async function adminUsersReload(){const box=document.getElementById('adminUsers');if(!box)return;const {data,error}=await sb.from('profiles').select('id,username,class_name,role,created_at').order('created_at',{ascending:false});if(error){box.innerHTML=`<div class="notice bad">${e(error.message)}</div>`;return}if(!data?.length){box.innerHTML='<div class="small muted">Пользователей нет.</div>';return}box.innerHTML=data.map(u=>`<div class="adminUser"><div><b>${e(u.username)}</b><div class="small muted">${e(u.class_name)} · ${e(u.role)}</div></div><button class="tinyBtn ${u.role==='admin'?'dangerBtn':''}" data-user-role="${e(u.id)}" data-role="${e(u.role)}">${u.role==='admin'?'Снять admin':'Сделать admin'}</button></div>`).join('');box.querySelectorAll('[data-user-role]').forEach(b=>b.onclick=()=>toggleUserRole(b.dataset.userRole,b.dataset.role))}
async function toggleUserRole(id,role){const next=role==='admin'?'user':'admin';if(id===session.user.id&&next==='user'&&!confirm('Снять admin с себя? После этого админка станет недоступна.'))return;if(!confirm(`${next==='admin'?'Сделать пользователя админом':'Снять права admin'}?`))return;const {error}=await sb.from('profiles').update({role:next}).eq('id',id);if(error)return alert('Не удалось изменить роль: '+error.message);if(id===session.user.id)profile={...profile,role:next};await adminUsersReload();render()}
async function deleteSchedule(className){if(!confirm(`Удалить расписание для ${className}?`))return;const {data,error:readError}=await sb.from('schedules').select('class_name');if(readError)return alert('Не удалось прочитать расписания: '+readError.message);let aliases=(data||[]).filter(x=>normalizeClassName(x.class_name)===normalizeClassName(className)).map(x=>x.class_name);if(!aliases.length)aliases=[className];const {error}=await sb.from('schedules').delete().in('class_name',aliases);if(error)return alert('Не удалось удалить: '+error.message);if(normalizeClassName(profile.class_name)===normalizeClassName(className))schedule=null;await adminStats();await adminClasses();await loadSchedule();render()}
function openScheduleEditor(className){loadScheduleForEdit(className)}
async function loadScheduleForEdit(className){const canonical=normalizeClassName(className)||className;const {data,error}=await sb.from('schedules').select('class_name,lessons,updated_at').order('updated_at',{ascending:false});if(error)return alert(error.message);const matches=(data||[]).filter(x=>normalizeClassName(x.class_name)===canonical);if(!matches.length)return alert('Расписание не найдено.');let lessons=normalizeLessons(matches.flatMap(x=>Array.isArray(x.lessons)?x.lessons:[]));const renderRows=()=>lessons.map((x,i)=>`<div class="lessonEdit"><b>${i+1}</b><div class="grid"><input data-k="day" data-i="${i}" value="${e(x.day||'Понедельник')}" placeholder="День"><input data-k="subject" data-i="${i}" value="${e(x.subject||'')}" placeholder="Предмет"><input data-k="time" data-i="${i}" value="${e(x.time||'')}" placeholder="Время"><button class="tinyBtn dangerBtn" data-del-lesson="${i}">×</button><input data-k="lesson" data-i="${i}" value="${e(x.lesson||i+1)}" placeholder="№"><input data-k="room" data-i="${i}" value="${e(x.room||'')}" placeholder="Кабинет"></div></div>`).join('');modal(`<div class="modalHead"><h3>Расписание · ${e(canonical)}</h3>${closeButton()}</div><div class="small muted" style="margin-bottom:10px">Если в базе были варианты вроде 8а / 8 А, они уже объединены.</div><div id="lessonRows">${renderRows()||'<div class="small muted">Уроков пока нет.</div>'}</div><div class="rowActions" style="margin-top:12px"><button class="secondary" id="addLessonRow">+ Урок</button><button class="primary" id="saveSchedule">Сохранить</button></div>`);const rows=document.getElementById('lessonRows');const sync=()=>{rows.querySelectorAll('[data-k]').forEach(inp=>{const i=+inp.dataset.i;const k=inp.dataset.k;lessons[i][k]=k==='lesson'?Number(inp.value||i+1):inp.value})};rows.oninput=sync;rows.onclick=ev=>{const b=ev.target.closest('[data-del-lesson]');if(b){lessons.splice(+b.dataset.delLesson,1);rows.innerHTML=renderRows()||'<div class="small muted">Уроков пока нет.</div>';rows.oninput=sync}};document.getElementById('addLessonRow').onclick=()=>{lessons.push({day:'Понедельник',lesson:lessons.length+1,subject:'',time:'',room:''});rows.innerHTML=renderRows();rows.oninput=sync};document.getElementById('saveSchedule').onclick=async()=>{sync();const clean=normalizeLessons(lessons);const {error}=await sb.from('schedules').upsert({class_name:canonical,lessons:clean,updated_at:new Date().toISOString(),updated_by:session.user.id},{onConflict:'class_name'});if(error)return alert(error.message);const aliases=matches.map(x=>x.class_name).filter(x=>x!==canonical);if(aliases.length){const {error:deleteError}=await sb.from('schedules').delete().in('class_name',aliases);if(deleteError)return alert('Расписание сохранено, но старые варианты класса не удалились: '+deleteError.message)}closeModal();await loadSchedule();await adminStats();await adminClasses();render()}}

function bind(){document.getElementById('hamb').onclick=()=>openMenu();document.getElementById('accountTop').onclick=()=>{route='account';render()};document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{route=x.dataset.r;render()});document.querySelectorAll('[data-r2]').forEach(x=>x.onclick=()=>{route=x.dataset.r2;render()});document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>act(x.dataset.a,x.dataset));document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{local.settings[x.dataset.toggle]=!local.settings[x.dataset.toggle];saveLocal();render()});document.querySelectorAll('[data-theme]').forEach(x=>x.onclick=()=>{local.settings.theme=x.dataset.theme;saveLocal();render()});document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{local.settings.accent=x.dataset.color;saveLocal();render()});document.querySelectorAll('[data-target]').forEach(x=>x.onclick=()=>{local.targets[x.dataset.target]=+x.dataset.value;saveLocal();render()});document.querySelectorAll('[data-cal-date]').forEach(x=>x.onclick=()=>openCalendarNote(x.dataset.calDate));document.querySelectorAll('[data-class-tab]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-class-tab]').forEach(b=>b.classList.remove('sel'));x.classList.add('sel');const card=document.querySelectorAll('#allScheduleCards .classScheduleCard')[CLASSES.findIndex(c=>(normalizeClassName(c)||c)===x.dataset.classTab)];card?.scrollIntoView({behavior:'smooth',block:'start'})});document.querySelector('[data-cal-prev]')?.addEventListener('click',()=>{calendarState.m--;if(calendarState.m<0){calendarState.m=11;calendarState.y--}render()});document.querySelector('[data-cal-next]')?.addEventListener('click',()=>{calendarState.m++;if(calendarState.m>11){calendarState.m=0;calendarState.y++}render()});const p=document.getElementById('adminScheduleFile');const pick=document.getElementById('pickAdminScheduleFile');if(p){p.onchange=readAdminScheduleFile;pick?.addEventListener('click',()=>p.click())}if(route==='admin'){adminStats();adminClasses();adminUsersReload()}}

function openMenu(){const existing=document.getElementById('sideMenu');if(existing){existing.remove();return}const d=document.createElement('div');d.id='sideMenu';d.innerHTML=`<div style="position:fixed;inset:0;background:#0008;z-index:70" id="menuBg"><div class="menu" style="position:absolute;left:10px;top:72px;right:10px;max-width:360px"><button data-menu="home">⌂ Главная</button><button data-menu="homework">▤ Домашние задания</button><button data-menu="grades">▱ Оценки</button><button data-menu="schedules">▦ Расписания</button><button data-menu="calendar">◷ Календарь</button><button data-menu="absences">☒ Пропуски</button><button data-menu="account">👤 Аккаунт</button><button data-menu="settings">⚙ Настройки</button>${isAdmin()?'<button data-menu="admin">🛡 Админ-панель</button>':''}<button class="danger" data-menu="logout">🚪 Выйти</button></div></div>`;document.body.appendChild(d);document.getElementById('menuBg').onclick=x=>{if(x.target.id==='menuBg')d.remove()};d.querySelectorAll('[data-menu]').forEach(b=>b.onclick=async()=>{const r=b.dataset.menu;d.remove();if(r==='logout'){await sb.auth.signOut();session=null;profile=null;schedule=null;allSchedules={};route='home';render();return}route=r;render()})}
async function act(a,d){
 if(a==='account'){route='account';render()}
 if(a==='addHw')openHw();
 if(a==='editHw'){const x=local.homework.find(x=>x.id==d.id);if(x)openHw(x)}
 if(a==='deleteHw'){if(confirm('Удалить это задание?')){local.homework=local.homework.filter(x=>x.id!=d.id);saveLocal();render()}}
 if(a==='addAbsence')openAbsence();
 if(a==='markAbsence')openAbsence({subject:d.subject,day:d.day});
 if(a==='deleteAbsence'){if(confirm('Удалить эту отметку о пропуске?')){local.absences=local.absences.filter(x=>x.id!=d.id);saveLocal();render()}}
 if(a==='addSubject')openSubject();
 if(a==='addGrade')openGrade(d.s||'');
 if(a==='editOneGrade')openEditOneGrade(d.s||'',+(d.i||0));
 if(a==='editGrades')openEditGrades(d.s||'');
 if(a==='toggleHw'){let x=local.homework.find(x=>x.id==d.id);if(x){x.done=!x.done;saveLocal();render()}}
 if(a==='gm'){let m=document.getElementById('gm-'+sid(d.s));document.querySelectorAll('.menu').forEach(x=>{if(x!==m)x.hidden=true});m.hidden=!m.hidden}
 if(a==='delSubject'){if(confirm('Удалить предмет и все его оценки?')){delete local.grades[d.s];delete local.targets[d.s];saveLocal();render()}}
 if(a==='schedMenu'){const m=document.getElementById('schedMenu');m.hidden=!m.hidden}
 if(a==='scheduleReload'){await loadAllSchedules();await loadSchedule();render()}
 if(a==='saveAccount'){const username=document.getElementById('an').value.trim();const className=normalizeClassName(document.getElementById('ac2').value)||document.getElementById('ac2').value;if(username.length<2)return alert('Никнейм слишком короткий.');const oldClass=normalizeClassName(profile.class_name)||profile.class_name;const newEmail=technicalEmail(username);const emailChange=await sb.auth.updateUser({email:newEmail});if(emailChange.error)return alert('Не удалось изменить ник/логин: '+emailChange.error.message);const {data,error}=await sb.from('profiles').update({username,class_name:className}).eq('id',session.user.id).select().single();if(error)return alert(error.message);profile=data;route='home';await loadSchedule();render();if(oldClass!==className)setTimeout(()=>loadSchedule().then(render),50)}
 if(a==='changePassword'){const p=document.getElementById('newpass').value;if(p.length<6)return alert('Пароль должен быть не короче 6 символов.');const {error}=await sb.auth.updateUser({password:p});if(error)return alert(error.message);alert('Пароль изменён.');document.getElementById('newpass').value=''}
 if(a==='logout'){stopScheduleRealtime();await sb.auth.signOut();session=null;profile=null;schedule=null;render()}
 if(a==='adminReload'){await adminStats();await adminClasses()}
 if(a==='adminUsersReload')await adminUsersReload()
}

function b64file(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
sb.auth.onAuthStateChange(async(_event,s)=>{if(s){session=s;if(!profile)await bootUser(s)}else{stopScheduleRealtime();session=null;profile=null;schedule=null;allSchedules={};render()}});
(async()=>{apply();const {data}=await sb.auth.getSession();if(data.session){session=data.session;await bootUser(session)}else render()})();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
